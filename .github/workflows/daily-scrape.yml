name: Scraping diario de mercados energéticos

on:
  # Se elimina el "schedule" de GitHub: ahora el único disparador diario es
  # cron-job.org, que llama a este mismo workflow_dispatch por API a las
  # 7:05h Madrid. Tener también el cron interno de GitHub causaba envíos
  # duplicados, porque cualquier disparo por workflow_dispatch fuerza la
  # ejecución sin comprobar si ya se hizo hoy (ver FORCE_RUN más abajo).
  workflow_dispatch:       # permite lanzarlo manualmente desde la pestaña Actions, o vía API (cron-job.org)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          # workflow_dispatch (tanto manual como el de cron-job.org) fuerza
          # la ejecución sin comprobar si ya hay snapshot de hoy. Como ahora
          # solo hay un disparador diario, esto es seguro; si algún día se
          # relanza manualmente el mismo día ya ejecutado, se reenviaría el
          # email (asúmelo si pruebas a mano el mismo día).
          FORCE_RUN: '1'
        run: python scrape_markets.py

      - name: Actualizar Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python update_google_sheet.py

      - name: Enviar email diario
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Commit y push de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Snapshot de mercados $(date -u +%Y-%m-%d)"
          git push
