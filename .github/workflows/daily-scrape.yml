name: Scraper Precios 2.0TD — Diario

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python
        run: |
          pip install playwright requests gspread google-auth beautifulsoup4

      - name: Instalar navegador Chromium
        run: playwright install chromium --with-deps

      - name: Pre-descargar HTML de Iberdrola con curl
        run: |
          mkdir -p iberdrola_cache
          curl -s -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            -H "Referer: https://www.iberdrola.es/" \
            --cookie-jar iberdrola_cache/cookies.txt \
            "https://www.iberdrola.es/luz/tarifas/plan-online" \
            -o iberdrola_cache/plan-online.html
          curl -s -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            -H "Referer: https://www.iberdrola.es/" \
            --cookie-jar iberdrola_cache/cookies.txt \
            "https://www.iberdrola.es/luz/tarifas/plan-online-tres-periodos" \
            -o iberdrola_cache/plan-online-3p.html
          echo "HTML descargado. Tamaños:"
          wc -c iberdrola_cache/*.html

      - name: Ejecutar scraper
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Subir backup JSON
        uses: actions/upload-artifact@v4
        with:
          name: precios-${{ github.run_id }}
          path: data/
          retention-days: 90

      - name: Subir dashboard generado
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard_dist/
          retention-days: 30
