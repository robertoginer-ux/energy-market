name: Scraping diario de mercados energéticos

on:
  schedule:
    # GitHub Actions solo admite cron en UTC (sin cambio de hora) y puede
    # retrasar la ejecución varias horas en repos con poca actividad —
    # por eso disparamos a las 4:13h Madrid en vez de a las 7:00h, para
    # dejar margen, y usamos un minuto "raro" (13, no 00) porque las colas
    # de GitHub están menos saturadas fuera de los minutos redondos.
    - cron: '13 2 * * *'   # 4:13 en horario de verano (CEST, UTC+2)
    - cron: '13 3 * * *'   # 4:13 en horario de invierno (CET, UTC+1)
  workflow_dispatch:       # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scrape_markets.py

      - name: Actualizar Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python update_google_sheet.py

      - name: Enviar email diario
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Commit y push de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Snapshot de mercados $(date -u +%Y-%m-%d)"
          git push
