name: Scraping diario de mercados energéticos

on:
  schedule:
    # IMPORTANTE: GitHub Actions no entiende estaciones del año — un cron
    # programado "para verano" y otro "para invierno" se ejecutan LOS DOS
    # todos los días (esto causó el envío duplicado del email). Por eso
    # dejamos un único disparador: como el script ya no depende de la hora
    # exacta (ver ya_se_ejecuto_hoy en scrape_markets.py), un solo cron es
    # suficiente y elimina el riesgo de duplicados.
    - cron: '13 3 * * *'   # 4:13 CET (invierno) / 5:13 CEST (verano)
  workflow_dispatch:       # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        env:
          # Si se lanza manualmente (workflow_dispatch), forzamos la ejecución
          # aunque no sean exactamente las 7:00h.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scrape_markets.py

      - name: Actualizar Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python update_google_sheet.py

      - name: Enviar email diario
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python send_email.py

      - name: Commit y push de los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Snapshot de mercados $(date -u +%Y-%m-%d)"
          git push
